name: Build TouringHub_APP signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touringhub-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      # Do not change local Gradle signing/build configuration.
      # Build unsigned locally, then sign only on the GitHub runner.
      - name: Assemble unsigned Android release
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Sign and verify APK
        shell: bash
        env:
          TOURINGHUB_KEYSTORE_BASE64: ${{ secrets.TOURINGHUB_KEYSTORE_BASE64 }}
          TOURINGHUB_SIGNING_PASSWORD: ${{ secrets.TOURINGHUB_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TOURINGHUB_KEYSTORE_BASE64" || -z "$TOURINGHUB_SIGNING_PASSWORD" ]]; then
            echo "::error::Set TOURINGHUB_KEYSTORE_BASE64 and TOURINGHUB_SIGNING_PASSWORD in Repository secrets."
            exit 1
          fi

          umask 077
          keystore="$RUNNER_TEMP/touringhub-release.p12"
          printf '%s' "$TOURINGHUB_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          mapfile -t unsigned < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' | sort)
          if [[ ${#unsigned[@]} -ne 1 ]]; then
            echo "::error::Expected one unsigned release APK, found ${#unsigned[@]}."
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          aligned="$RUNNER_TEMP/touringhub-aligned.apk"
          mkdir -p dist/actions
          signed="dist/actions/TouringHub_APP-release.apk"

          "$build_tools/zipalign" -f -P 16 4 "${unsigned[0]}" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias touringhub-release \
            --ks-pass env:TOURINGHUB_SIGNING_PASSWORD \
            --key-pass env:TOURINGHUB_SIGNING_PASSWORD \
            --out "$signed" \
            "$aligned"

          "$build_tools/apksigner" verify --verbose --print-certs "$signed"
          test -s "$signed"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: TouringHub_APP-signed-release
          path: dist/actions/TouringHub_APP-release.apk
          if-no-files-found: error
          retention-days: 14
